name: Lifecycle

# Opens release PRs with release-please and, once one is merged, publishes the release
# with the plugin jar and index-entry.json, the entry for https://github.com/headlesshq/headlessmc-plugins.
"on":
  push:
    branches: [main]

jobs:
  release-please:
    runs-on: ubuntu-latest
    # The template repository itself must never create release PRs or releases.
    # github.event.repository.is_template is true there and false in every repo generated from it.
    if: ${{ !github.event.repository.is_template }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  release:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          submodules: recursive
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          java-version: 25
          distribution: temurin
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build generatePluginIndexEntry --stacktrace
      - name: Upload the plugin jar and index entry
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          name=$(sed -n "s/^rootProject.name *= *['\"]\(.*\)['\"].*/\1/p" settings.gradle)
          version=$(sed -n 's/^version=//p' gradle.properties)
          jar="$name-$version.jar"
          entry=build/headlessmc-plugin/index-entry.json
          url=$(jq -r '.downloads[0].url' "$entry")
          homepage=$(jq -r '.homepage' "$entry")
          expected="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$TAG/$jar"
          if [ "$url" != "$expected" ]; then
            case "$url" in
              "${homepage%/}/releases/download/"*)
                echo "::error file=build.gradle::downloadUrl $url is not the jar of this release ($expected), set headlessmcPlugin.homepage to your repository"
                exit 1;;
              *)
                echo "::warning file=build.gradle::downloadUrl $url is not an asset of this release, make sure the jar is hosted there";;
            esac
          fi
          gh release upload "$TAG" "build/libs/$jar" \
            build/headlessmc-plugin/index-entry.json --clobber
      - name: Plugin index entry
        run: |
          {
            echo 'Add this entry to `plugins` in the `index.json` of [headlessmc-plugins](https://github.com/headlesshq/headlessmc-plugins),'
            echo 'or, if the plugin is already listed there, append its `downloads` to the existing entry:'
            echo
            echo '```json'
            cat build/headlessmc-plugin/index-entry.json
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
