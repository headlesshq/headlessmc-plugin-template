name: Build

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          java-version: 25
          distribution: temurin
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build
        run: ./gradlew build --stacktrace
      - name: Generate the plugin index entry
        run: ./gradlew generatePluginIndexEntry --stacktrace
      - name: Check the plugin homepage
        if: github.repository != 'headlesshq/headlessmc-plugin-template' && !github.event.repository.fork
        run: |
          name=$(sed -n "s/^rootProject.name *= *['\"]\(.*\)['\"].*/\1/p" settings.gradle)
          version=$(sed -n 's/^version=//p' gradle.properties)
          url=$(jq -r '.downloads[0].url' build/headlessmc-plugin/index-entry.json)
          expected="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$version/$name-$version.jar"
          lc() { printf '%s' "$1" | tr '[:upper:]' '[:lower:]'; }
          if [ "$(lc "$url")" != "$(lc "$expected")" ]; then
            case "$(lc "$url")" in
              "$(lc "$GITHUB_SERVER_URL")"/*/*/releases/download/*)
                echo "::error file=build.gradle::downloadUrl $url is not the jar of a release of this repository ($expected), set headlessmcPlugin.homepage to your repository"
                exit 1;;
              *)
                echo "::warning file=build.gradle::downloadUrl $url is not an asset of a release of this repository, make sure the jar is hosted there";;
            esac
          fi
      - name: Upload plugin
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: plugin
          path: build/libs/*.jar
